<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="ciTitle ciDesc">
  <title id="ciTitle">Wall time of the real CI unit tier at a 41 percent CPU cap and at a 71 percent cap</title>
  <desc id="ciDesc">The unit tier took 95 seconds at 1.30 GHz and 54 seconds at 2.40 GHz, with zero throttle events in both runs. Peak package temperature rose from 57 to 67 C.</desc>
  <rect x="1" y="1" width="758" height="318" rx="10" fill="#fcfcfd" stroke="#e5e5e8" stroke-width="1"/>
  <text x="70" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#3f3f46">real CI workload (pnpm test), one run per cap, same commit</text>
    <line x1="70" y1="127.8" x2="720" y2="127.8" stroke="#a1a1aa" stroke-opacity="0.28" stroke-width="1"/>
    <text x="66" y="131.8" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">50 s</text>
    <line x1="70" y1="59.6" x2="720" y2="59.6" stroke="#a1a1aa" stroke-opacity="0.28" stroke-width="1"/>
    <text x="66" y="63.6" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">100 s</text>
    
    <rect x="150" y="66.5" width="124" height="129.5" rx="3" fill="#2563eb"/>
    <text x="212" y="90.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#ffffff">95 s</text>
    <text x="212" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#3f3f46">41% cap = 1.30 GHz</text>
    <text x="212" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">turbo off · peak 57 C</text>
    <text x="212" y="253" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">0 MSR throttle events</text>
    
    <rect x="430" y="122.4" width="124" height="73.6" rx="3" fill="#d97706"/>
    <text x="492" y="146.4" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#ffffff">54 s</text>
    <text x="492" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#3f3f46">71% cap = 2.40 GHz</text>
    <text x="492" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">turbo off · peak 67 C</text>
    <text x="492" y="253" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">0 MSR throttle events</text>
    <line x1="70" y1="196" x2="720" y2="196" stroke="#a1a1aa" stroke-opacity="0.6" stroke-width="1"/>
    <text x="380" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#71717a">1 Hz turbostat intervals covering the CPU-bound work · measured 2026-09-25 on the CI host</text>
</svg>
